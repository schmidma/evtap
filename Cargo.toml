[package]
name = "evtap"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = "1.2.1"
clap = { version = "4.5.53", features = ["derive"] }
color-eyre = "0.6.5"
eframe = "0.33.2"
evdev = { version = "0.13.2", features = ["tokio"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["full"] }
tokio-util = "0.7.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
xkbcommon = "0.9.0"
