[package]
name = "evtap"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
camino = "1.2.5"
color-eyre = "0.6.5"
eframe = { version = "0.35.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
evdev = { version = "0.13.2", features = ["tokio"] }
tokio = { version = "1.53.1", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "sync",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xkbcommon = "0.9.0"
